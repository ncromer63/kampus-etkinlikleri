<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etkinlik Güncelle - Kampüs Etkinlikleri</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <link rel="stylesheet" href="css/2416501085.css">
  <script type="module" src="js/event-form.js"></script>
</head>
<body>

  <header>
    <div class="header-container">
      <h1>Etkinlik Güncelle</h1>
      <p class="subtitle">Mevcut etkinlik bilgilerini güncelleyin.</p>
      <nav>
        <a href="index.html">Ana Sayfa</a>
        <a href="etkinlikler.html">Etkinlikler</a>
        <a href="etkinlik-ekle.html">Ekle</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="form-container">
      <p class="form-info">Alanlar mevcut etkinliğin bilgileriyle dolu gelir. Bu sprintte form veri güncellemez; sonuç aşağıda gösterilir.</p>

      <form id="etkinlik-formu" data-mode="guncelle" novalidate>
        <div class="form-grup">
          <label for="ad">Etkinlik Adı *</label>
          <input type="text" id="ad" name="ad">
          <span class="hata-mesaji" id="ad-hata"></span>
        </div>

        <div class="form-grup">
          <label for="kategori">Kategori *</label>
          <select id="kategori" name="kategori">
            <option value="">Seçiniz</option>
          </select>
          <span class="hata-mesaji" id="kategori-hata"></span>
        </div>

        <div class="form-grup">
          <label for="tarih">Tarih *</label>
          <input type="date" id="tarih" name="tarih">
          <span class="hata-mesaji" id="tarih-hata"></span>
        </div>

        <div class="form-grup">
          <label for="saat">Saat *</label>
          <input type="time" id="saat" name="saat">
          <span class="hata-mesaji" id="saat-hata"></span>
        </div>

        <div class="form-grup">
          <label for="yer">Yer *</label>
          <input type="text" id="yer" name="yer">
          <span class="hata-mesaji" id="yer-hata"></span>
        </div>

        <div class="form-grup">
          <label for="kontenjan">Kontenjan</label>
          <input type="number" id="kontenjan" name="kontenjan">
          <span class="hata-mesaji" id="kontenjan-hata"></span>
        </div>

        <div class="form-grup">
          <label for="aciklama">Açıklama</label>
          <textarea id="aciklama" name="aciklama" rows="4"></textarea>
          <span class="hata-mesaji" id="aciklama-hata"></span>
        </div>

        <button type="submit" class="btn btn-primary">Güncelle</button>
      </form>

      <div id="form-mesaj"></div>
    </div>
  </main>

  <footer>
    <p>Ömer Nacar · 2416501085 · 2026</p>
  </footer>

</body>
</html>
